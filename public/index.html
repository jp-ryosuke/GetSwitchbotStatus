<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Home Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  margin: 0;
  font-family: sans-serif;
  background: #1e1e1e;
  color: #fff;
}

header {
  background: #2c2c2c;
  padding: 12px 20px;
  font-size: 18px;
  border-bottom: 1px solid #444;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
  gap: 20px;
  padding: 20px;
}

.card {
  background: #2c2c2c;
  border-radius: 12px;
  padding: 16px;
  min-height: 380px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.card-graph {
  margin-top: auto;
}

.device-name {
  font-size: 18px;
  font-weight: bold;
}

.device-type {
  font-size: 12px;
  color: #aaa;
}

.status {
  font-size: 20px;
  margin-top: 10px;
  margin-bottom: 10px;
}

.small {
  font-size: 14px;
}

canvas {
  width: 100% !important;
  height: 160px !important;
}

#loading {
  padding: 20px;
}

</style>
</head>

<body>

<header>🏠 Home Dashboard</header>

<div id="loading">⏳ Loading...</div>
<div class="grid" id="devices"></div>

<script>
const history = {}; // デバイスごとの履歴

function formatSimpleStatus(s) {
  let html = '';

  if (s.temperature !== undefined) {
    html += `🌡 ${s.temperature}℃ `;
  }

  if (s.humidity !== undefined) {
    html += `💧 ${s.humidity}% `;
  }

  if (s.lockState) {
    html += `🔐 ${s.lockState} `;
  }

  if (s.power) {
    html += `🔌 ${s.power} `;
  }

  if (s.battery !== undefined) {
    html += `🔋 ${s.battery}%`;
  }

  return html || 'No Data';
}

function createChart(canvas, data) {
  return new Chart(canvas, {
    type: 'line',
    data: {
      labels: data.map(() => ''),
      datasets: [
        {
          label: 'Temperature (℃)',
          data: data.map(d => d.t),
          borderColor: '#ff7043',
          backgroundColor: '#ff7043',
          borderWidth: 2,
          tension: 0.3
        },
        {
          label: 'Humidity (%)',
          data: data.map(d => d.h),
          borderColor: '#42a5f5',
          backgroundColor: '#42a5f5',
          borderWidth: 2,
          tension: 0.3
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,

      plugins: {
        legend: {
          display: true,
          labels: {
            color: '#ccc',
            font: { size: 12 }
          }
        }
      },

      scales: {
        x: {
          display: false
        },
        y: {
          display: true,
          ticks: {
            font: { size: 10 }
          }
        }
      }
    }
  });
}

async function loadDevices() {
  const loading = document.getElementById('loading');
  const container = document.getElementById('devices');

  try {
    loading.style.display = 'block';

    const res = await fetch('/api/devices');
    const devices = await res.json();

    container.innerHTML = '';

    devices.forEach(d => {
      const el = document.createElement('div');
      el.className = 'card';

      const s = d.status || {};

      // ===== 温湿度なら履歴保存 =====
      if (s.temperature !== undefined && s.humidity !== undefined) {
        if (!history[d.deviceId]) history[d.deviceId] = [];

        history[d.deviceId].push({
          t: s.temperature,
          h: s.humidity
        });

        // 最大30件
        if (history[d.deviceId].length > 30) {
          history[d.deviceId].shift();
        }
      }

      // ===== HTML生成 =====
      if (s.temperature !== undefined && s.humidity !== undefined) {
        el.innerHTML = `
          <div>
            <div class="device-name">${d.deviceName}</div>
            <div class="device-type">${d.deviceType}</div>
            <div class="status">
              🌡 ${s.temperature}℃<br>
              💧 ${s.humidity}%<br>
              🔋 ${s.battery}%
            </div>
          </div>
          <div class="card-graph">
            <canvas id="chart-${d.deviceId}"></canvas>
          </div>
        `;
      } else {
        el.innerHTML = `
          <div>
            <div class="device-name">${d.deviceName}</div>
            <div class="device-type">${d.deviceType}</div>
            <div class="status small">
              ${formatSimpleStatus(s)}
            </div>
          </div>
        `;
      }

      container.appendChild(el);

      // ===== グラフ描画 =====
      if (history[d.deviceId]) {
        const ctx = document.getElementById(`chart-${d.deviceId}`);
        if (ctx) {
          createChart(ctx, history[d.deviceId]);
        }
      }
    });

  } catch (e) {
    console.error(e);
  } finally {
    loading.style.display = 'none';
  }
}

loadDevices();
setInterval(loadDevices, 5000);
</script>

</body>
</html>
