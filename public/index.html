<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Home Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="/js/app.js" defer></script>

<style>
body {
  margin: 0;
  font-family: sans-serif;
  background: #1e1e1e;
  color: #fff;
}

header {
  background: #2c2c2c;
  padding: 12px 20px;
  font-size: 18px;
  border-bottom: 1px solid #444;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
  gap: 20px;
  padding: 20px;
}

.card {
  background: #2c2c2c;
  border-radius: 12px;
  padding: 16px;
  min-height: 380px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.card-graph {
  margin-top: auto;
}

.device-name {
  font-size: 18px;
  font-weight: bold;
}

.device-type {
  font-size: 12px;
  color: #aaa;
}

.status {
  font-size: 20px;
  margin-top: 10px;
  margin-bottom: 10px;
}

.small {
  font-size: 14px;
}

canvas {
  width: 100% !important;
  height: 160px !important;
}

#loading {
  padding: 20px;
}

#error {
  padding: 20px;
  color: #ff8a80;
}

#error[hidden] {
  display: none;
}

</style>
</head>

<body>

<header>🏠 Home Dashboard</header>

<div id="loading">⏳ Loading...</div>
<div id="error" role="alert" hidden></div>
<div class="grid" id="devices"></div>

</body>
</html>
